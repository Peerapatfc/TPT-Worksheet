<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font configuration for code-rendered pages (sharp → librsvg → Pango → fontconfig).
  src/lib/fonts.js points FONTCONFIG_FILE here before the first render, so the
  bundled Nunito in this directory is used on every machine (CI Ubuntu, macOS).
  The system font directories below are only a fallback for glyphs Nunito lacks
  (Thai, emoji, …); every Latin page text is set in Nunito.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
